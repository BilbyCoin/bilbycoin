
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BilbyCoin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b18;color:white;font-family:Arial,sans-serif}
.app{max-width:440px;margin:auto;padding:22px 18px 35px}
header{text-align:center;color:#eac45c;font-weight:bold;letter-spacing:3px}
.logo{margin:25px auto 12px;width:130px;height:130px;border:3px solid #e8bd4c;border-radius:50%;display:grid;place-items:center;font-size:70px;background:linear-gradient(145deg,#29213c,#111629);box-shadow:0 0 30px #b18a3444}
h1{text-align:center;color:#f5cf69;margin:10px 0 5px}
.tag{text-align:center;color:#a8a9bd;font-size:12px;letter-spacing:2px}
.balance{margin-top:28px;padding:22px;border:1px solid #b18a4a;border-radius:18px;background:linear-gradient(135deg,#202039,#111629)}
.small{color:#b9b9c9;font-size:13px}
.amount{font-size:34px;color:#f5cf69;font-weight:bold;margin:10px 0}
.stats{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.stat{background:#ffffff0d;padding:12px;border-radius:12px;flex:1}
.stat strong{display:block;color:#f5cf69;margin-top:8px}
h3{color:#eac45c;margin:28px 0 14px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.item{background:#171b30;border:1px solid #34334b;border-radius:14px;padding:20px 5px;text-align:center;color:white;font-size:14px}
.item span{display:block;font-size:25px;margin-bottom:9px}
footer{text-align:center;color:#77798f;font-size:12px;margin-top:28px}
</style>
</head>
<body>
<div class="app">
<header>BILBYCOIN</header>
<div class="logo">🐾</div>
<h1>BilbyCoin</h1>
<div class="tag">CLAIM • REFER • GROW</div>
<div class="balance">
<div class="small">TOTAL ACCUMULATED BALANCE</div>
<div class="amount">0 BILBY</div>
<div class="stats">
<div class="stat"><div class="small">Today's Points</div><strong>0</strong></div>
<div class="stat"><div class="small">Referral Points</div><strong>0</strong></div>
</div>
</div>
<h3>Explore BilbyCoin</h3>
<div class="menu">
<div class="item"><span>🏠</span>Home</div>
<div class="item"><span>🎯</span>Tasks</div>
<div class="item"><span>👥</span>Invite</div>
<div class="item"><span>📜</span>History</div>
<div class="item"><span>👛</span>Wallet</div>
<div class="item"><span>🪂</span>Airdrops</div>
</div>
<footer>BilbyCoin • Claim • Refer • Grow</footer>
</div>
</body>
</html>
